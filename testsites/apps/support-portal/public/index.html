<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support portal · JacHacks</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><header><span class="eyebrow">JacHacks / Demo workspace</span><h1>Support portal</h1><p>Keep every question moving toward an answer.</p></header><section id="signin"><h2>Sign in</h2><p>Demo users: alice / alice-demo-pass or bob / bob-demo-pass.</p><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></section><p id="status" role="status" aria-live="polite"></p><div id="workspace" hidden><button id="logout" class="secondary">Sign out</button><div class="grid"><section><h2>Your tickets</h2><button id="refresh">Refresh tickets</button><ul id="items"></ul><form id="create"><label for="title">How can we help?</label><input id="title" maxlength="200" required><button>Submit ticket</button></form><button id="export" class="secondary">Export my tickets</button></section><section><h2>Account</h2><p>Review your account details.</p><button id="account">View account</button></section></div></div><section><h2>Response</h2><pre id="output">Sign in to get started.</pre></section></body></html>
