<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task board · JacHacks</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body><header><span class="eyebrow">JacHacks / Demo workspace</span><h1>Task board</h1><p>A small space for your next big launch.</p></header><section id="signin"><h2>Sign in</h2><p>Demo users: alice / alice-demo-pass or bob / bob-demo-pass.</p><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></section><p id="status" role="status" aria-live="polite"></p><div id="workspace" hidden><button id="logout" class="secondary">Sign out</button><div class="grid"><section><h2>Your tasks</h2><button id="refresh">Refresh tasks</button><ul id="items"></ul><form id="create"><label for="title">New task</label><input id="title" maxlength="200" required><button>Create task</button></form><form id="lookup"><label for="object-id">Open task by ID</label><input id="object-id" type="number" required><button>Open task</button></form></section><section id="admin" hidden><h2>Manage users</h2><button id="users">List users</button><form id="manage"><label for="user-id">User ID</label><input id="user-id" type="number" required><label for="display-name">Display name</label><input id="display-name" maxlength="80" required><button>Update name</button></form></section></div></div><section><h2>Response</h2><pre id="output">Sign in to get started.</pre></section></body></html>
