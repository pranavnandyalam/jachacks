name: jachacks-lab
x-sandbox: &sandbox
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 256m
  cpus: 1.0
  tmpfs: [/tmp]
services:
  task-board:
    <<: *sandbox
    build: ./apps/task-board
    ports: ["127.0.0.1:8101:8080"]
    environment:
      ADMIN_PASSWORD: ${TASK_ADMIN_PASSWORD:-task-admin-demo-pass}
      DATA_DIR: /data
    volumes: [task-data:/data]
    networks: [task-net]
  support-portal:
    <<: *sandbox
    build: ./apps/support-portal
    ports: ["127.0.0.1:8102:8080"]
    environment:
      ADMIN_PASSWORD: ${SUPPORT_ADMIN_PASSWORD:-support-admin-demo-pass}
      INTERNAL_SERVICE_TOKEN: ${SUPPORT_SERVICE_TOKEN:-synthetic-support-service-token}
      DATA_DIR: /data
    volumes: [support-data:/data]
    networks: [support-net]
  deployment-dashboard:
    <<: *sandbox
    build: ./apps/deployment-dashboard
    ports: ["127.0.0.1:8103:8080"]
    environment:
      ADMIN_PASSWORD: ${DEPLOY_ADMIN_PASSWORD:-deployment-runtime-demo-pass}
      DATA_DIR: /data
    volumes: [deployment-data:/data]
    networks: [deployment-net]
volumes:
  task-data:
  support-data:
  deployment-data:
networks:
  task-net:
    internal: true
  support-net:
    internal: true
  deployment-net:
    internal: true
